[workspace]
resolver = "3"
members = ["crates/jsbsim", "tools/oracle"]

[workspace.package]
edition = "2024"
license = "LGPL-2.1-or-later"
publish = false
rust-version = "1.99"

[workspace.dependencies]
clap = { version = "4", default-features = false, features = ["std", "help", "usage", "error-context", "env"] }
dhat = "0.3"
libm = "0.2"
roxmltree = "0.21"
serde = { version = "1", features = ["derive"] }
sha2 = "0.11"
tempfile = "3"
thiserror = "2"
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[workspace.lints.clippy]
unwrap_used = "forbid"
expect_used = "forbid"
panic = "forbid"
todo = "forbid"
unimplemented = "forbid"
unreachable = "forbid"
exit = "forbid"
mem_forget = "forbid"
get_unwrap = "forbid"
indexing_slicing = "deny"
let_underscore_must_use = "deny"
let_underscore_future = "deny"
await_holding_lock = "deny"
disallowed_types = "deny"
disallowed_macros = "deny"

# One codegen unit gives LLVM each crate whole to inline across, which
# makes frames faster (scripts/oracle-bench.sh). Rust codegen neither
# reorders nor fuses floating-point operations, so results do not change.
[profile.release]
codegen-units = 1
