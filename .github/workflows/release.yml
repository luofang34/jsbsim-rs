# SPDX-License-Identifier: LGPL-2.1-or-later
# Publishes jsbsim to crates.io when a tag v<version> is pushed whose
# version is the crate's own, after the package checks pass. The token is
# the repository secret CARGO_REGISTRY_TOKEN.
name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust
        with:
          cache-key: release
      - name: The tag is the crate's version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' crates/jsbsim/Cargo.toml | head -1)
          if [ "$TAG" != "v$version" ]; then
            echo "tag $TAG does not match crates/jsbsim/Cargo.toml version $version" >&2
            exit 1
          fi
      - name: Fetch the locked dependencies
        run: cargo fetch --locked
      - name: Package checks
        run: scripts/check-package.sh
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p jsbsim --locked
