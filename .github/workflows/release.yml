# SPDX-License-Identifier: LGPL-2.1-or-later
# Publishes jsbsim to crates.io when a tag v<version> is pushed whose
# version is the crate's own, after the package checks pass. Started by
# hand with an existing tag, it publishes that tag's source with these
# steps, for a tag whose own release run failed before publishing, or with
# dry_run checks the same steps, the token exchange included, without
# uploading. The job runs in the release environment, whose required
# reviewers approve each run, and crates.io trusted publishing exchanges
# the run's OIDC token for a short-lived registry token, so no registry
# token is stored in the repository.
name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to publish, such as v0.1.0
        required: true
      dry_run:
        description: Check everything but do not upload
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
          persist-credentials: false
      - uses: ./.github/actions/rust
        with:
          cache-key: release
      - name: The tag is the crate's version
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' crates/jsbsim/Cargo.toml | head -1)
          if [ "$TAG" != "v$version" ]; then
            echo "tag $TAG does not match crates/jsbsim/Cargo.toml version $version" >&2
            exit 1
          fi
      - name: Fetch the locked dependencies
        run: cargo fetch --locked
      - name: Package checks
        run: scripts/check-package.sh
      - name: Exchange the OIDC token for a crates.io token
        id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
        run: cargo publish -p jsbsim --locked $DRY_RUN
