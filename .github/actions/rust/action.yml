# SPDX-License-Identifier: LGPL-2.1-or-later
name: Rust toolchain
description: >
  Installs the toolchain rust-toolchain.toml pins, with its components and
  targets plus any extra targets, and caches the Cargo build.
inputs:
  root:
    description: The repository checkout, relative to the workspace.
    default: .
  targets:
    description: Extra targets to add, space separated.
    default: ""
  cache-key:
    description: Distinguishes this job's build cache from other jobs'.
    required: true
runs:
  using: composite
  steps:
    - name: Install the pinned toolchain
      shell: bash
      working-directory: ${{ inputs.root }}
      env:
        TARGETS: ${{ inputs.targets }}
      run: |
        rustup toolchain install
        for target in $TARGETS; do
          rustup target add "$target"
        done
        rustc --version
    - name: Cache the Cargo build
      uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      with:
        workspaces: ${{ inputs.root }}
        key: ${{ inputs.cache-key }}
