[package]
name = "jsbsim"
version = "0.0.0"
description = "Unofficial pure-Rust port of the JSBSim flight dynamics model"
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
libm.workspace = true
roxmltree.workspace = true
# Snapshot fingerprints; pure Rust, the same digest on every target.
sha2.workspace = true
thiserror.workspace = true
tracing.workspace = true

[features]
# Filesystem resolver for native front ends; the core itself does no I/O.
fs = []
# jsbsim::elementary forwards to the libm crate; only for
# scripts/oracle-sincos.sh, which patches the platform maths library in.
platform-libm = []

[lints]
workspace = true
