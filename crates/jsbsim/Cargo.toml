[package]
name = "jsbsim"
version = "0.2.0"
description = "Unofficial pure-Rust port of the JSBSim flight dynamics model"
edition.workspace = true
# The geodesic code is also MIT (GeographicLib) and the elementary
# functions also MIT OR Apache-2.0 WITH LLVM-exception (ARM
# optimized-routines), as their SPDX lines say.
license = "LGPL-2.1-or-later AND MIT AND (MIT OR Apache-2.0 WITH LLVM-exception)"
rust-version.workspace = true
readme = "README.md"
repository = "https://github.com/luofang34/jsbsim-rs"
keywords = ["jsbsim", "flight-dynamics", "flight-simulator", "aircraft", "simulation"]
categories = ["aerospace::simulation", "simulation", "science", "wasm"]
# LICENSE and LICENSES are symlinks to the repository root's licence
# texts; cargo packages the files they point to.
include = ["/src/**/*.rs", "/README.md", "/LICENSE", "/LICENSES/*.txt"]

[dependencies]
libm.workspace = true
roxmltree.workspace = true
# Snapshot fingerprints; pure Rust, the same digest on every target.
sha2.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
# The examples log what they show; the crate itself only emits events.
tracing-subscriber.workspace = true

[features]
# Filesystem resolver for native front ends; the core itself does no I/O.
fs = []
# jsbsim::elementary forwards to the libm crate instead of the bundled
# exp and pow, which changes results; only for scripts/oracle-sincos.sh,
# which patches the platform maths library in. Not for other crates.
__platform-libm = []
# The internals tools/oracle compares against C++ JSBSim
# (jsbsim::oracle_support, the public Fdm::models field). Not for other
# crates: nothing behind it is covered by semver.
__oracle = []

[package.metadata.docs.rs]
# __platform-libm is left out: it only serves scripts/oracle-sincos.sh.
features = ["fs"]
targets = ["x86_64-unknown-linux-gnu", "wasm32-unknown-unknown"]

# The examples the user manual (book/) includes. Each runs as a test, so a
# snippet that stops compiling or stops doing what the manual says fails CI.
[[example]]
name = "quickstart"
test = true

[[example]]
name = "fly_c172"
test = true
required-features = ["fs"]

[[example]]
name = "properties"
test = true
required-features = ["fs"]

[[example]]
name = "trim_and_linearize"
test = true
required-features = ["fs"]

[[example]]
name = "snapshots"
test = true

[[example]]
name = "terrain"
test = true

[[example]]
name = "resolvers"
test = true

[[example]]
name = "errors"
test = true

[lints]
workspace = true
