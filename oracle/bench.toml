# Cases of `oracle bench` (scripts/oracle-bench.sh), in report order.
# Paths are relative to the JSBSim root for C++ and to oracle/inputs for
# Rust. A case runs a script, or an aircraft flown from
# oracle::bench::AIRBORNE_IC at the default dt of 1/120 s. Warm-up plus
# timed frames must end before the run stops or touches down: mk82
# touches down at frame 2172 (dt 0.02), cannonball at about frame 4438
# (dt 0.00833333), Atmos_02 ends at 30 s, frame 3000 (dt 0.01), and the
# Shuttle touches down at 30.2 s, frame 3622.

[[case]]
name = "ball"
script = "scripts/ball.xml"
warm_up = 100
frames = 20000
repeats = 9

[[case]]
name = "ball_orbit_phase"
script = "scripts/ball_orbit_phase.xml"
warm_up = 100
frames = 20000
repeats = 9

[[case]]
name = "mk82_script"
script = "scripts/mk82_script.xml"
warm_up = 100
frames = 2000
repeats = 15

[[case]]
name = "cannonball"
script = "scripts/cannonball.xml"
warm_up = 100
frames = 4000
repeats = 15

[[case]]
name = "atmos_02"
script = "check_cases/NASA_EOM_2015/scripts/Atmos_02.xml"
aircraft_path = "check_cases/NASA_EOM_2015/aircraft"
warm_up = 100
frames = 2500
repeats = 15

# The aircraft that loads with the most frame work: 19 FCS components, 22
# aero functions and 12 tables.
[[case]]
name = "shuttle"
aircraft = "Shuttle"
warm_up = 100
frames = 2000
repeats = 15

# A piston single: the c172x, its autopilot's roll sensor noisy, its
# engine off.
[[case]]
name = "c172x"
aircraft = "c172x"
warm_up = 100
frames = 2000
repeats = 15

# A twin-turbine airliner: the 737 trimmed in a steady turn with its
# engines running (scripts/737_cruise_steady_turn.xml), timed from 1.7 s.
[[case]]
name = "737"
script = "scripts/737_cruise_steady_turn.xml"
warm_up = 200
frames = 2000
repeats = 15

# A turbine fighter on its gear: the F-16 starting its engine and
# spooling up (scripts/f16_test.xml), timed from 0.8 s to 17.5 s.
[[case]]
name = "f16"
script = "scripts/f16_test.xml"
warm_up = 100
frames = 2000
repeats = 15

# A rocket: the J246 launching (scripts/J2461.xml), timed from 13.3 s to
# 30 s with its four main engines and both solid boosters burning.
[[case]]
name = "j246"
script = "scripts/J2461.xml"
warm_up = 1600
frames = 2000
repeats = 15

# A helicopter: the ah1s on its gear (scripts/sim_primer.xml), its main
# rotor driven through the transmission under the governor and its tail
# rotor slaved to it, timed from 5 s to 21.7 s.
[[case]]
name = "ah1s"
script = "scripts/sim_primer.xml"
warm_up = 600
frames = 2000
repeats = 15
