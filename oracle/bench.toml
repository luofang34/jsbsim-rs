# Cases of `oracle bench` (scripts/oracle-bench.sh), in report order.
# Paths are relative to the JSBSim root for C++ and to oracle/inputs for
# Rust. A case runs a script, or an aircraft flown from
# oracle::bench::AIRBORNE_IC at the default dt of 1/120 s. Warm-up plus
# timed frames must end before the run stops or touches down: mk82
# touches down at frame 2172 (dt 0.02), cannonball at about frame 4438
# (dt 0.00833333), Atmos_02 ends at 30 s, frame 3000 (dt 0.01), and the
# Shuttle touches down at 30.2 s, frame 3622.

[[case]]
name = "ball"
script = "scripts/ball.xml"
warm_up = 100
frames = 20000
repeats = 9

[[case]]
name = "ball_orbit_phase"
script = "scripts/ball_orbit_phase.xml"
warm_up = 100
frames = 20000
repeats = 9

[[case]]
name = "mk82_script"
script = "scripts/mk82_script.xml"
warm_up = 100
frames = 2000
repeats = 15

[[case]]
name = "cannonball"
script = "scripts/cannonball.xml"
warm_up = 100
frames = 4000
repeats = 15

[[case]]
name = "atmos_02"
script = "check_cases/NASA_EOM_2015/scripts/Atmos_02.xml"
aircraft_path = "check_cases/NASA_EOM_2015/aircraft"
warm_up = 100
frames = 2500
repeats = 15

# The aircraft that loads with the most frame work: 19 FCS components, 22
# aero functions and 12 tables.
[[case]]
name = "shuttle"
aircraft = "Shuttle"
warm_up = 100
frames = 2000
repeats = 15

# A piston single: the c172x with its autopilot's sensor noise set to 0
# (oracle/derived/aircraft/c172x_noise0), its engine off.
[[case]]
name = "c172x"
aircraft = "c172x_noise0"
inputs = "oracle/derived"
warm_up = 100
frames = 2000
repeats = 15
