[[case]]
name = "Atmos_01"
archive = "Atmos_01_DroppedSphere"
root = "nasa"
script = "scripts/Atmos_01.xml"
aircraft_path = "aircraft"
section = "Appendix C.1.1, Table 25"

[[case.expected_miss]]
variable = "gePosition_ft_Y"
cause = "JSBSim's default integrators (rectangular Euler for rotation, Adams-Bashforth 2/3 for translation); inside with Adams-Bashforth 4 everywhere (outside by up to 2.7e-06 at t=30.0 s)."

[[case.expected_miss]]
variable = "feVelocity_ft_s_Y"
cause = "JSBSim's default integrators (rectangular Euler for rotation, Adams-Bashforth 2/3 for translation); inside with Adams-Bashforth 4 everywhere (outside by up to 9.3e-08 at t=8.4 s)."

[[case.expected_miss]]
variable = "eiVelocity_ft_s_X"
cause = "JSBSim's default integrators (rectangular Euler for rotation, Adams-Bashforth 2/3 for translation); inside with Adams-Bashforth 4 everywhere (outside by up to 1.4e-07 at t=30.0 s)."

[[case.expected_miss]]
variable = "speedOfSound_ft_s"
cause = "JSBSim's gas constant (FGAtmosphere.h Mair 28.9645 g/mol) differs from these simulators' at about 6e-7 relative in the speed of sound; the simulators disagree among the check-cases (the US 1976 value 28.9644 moves cases 1, 2, 6 and 7 inside but cases 4 and 5 outside), so no single constant is at fault (outside by up to 0.00061 at t=29.9 s)."

[[case.expected_miss]]
variable = "mach"
cause = "JSBSim's gas constant (FGAtmosphere.h Mair 28.9645 g/mol) differs from these simulators' at about 6e-7 relative in the speed of sound; the simulators disagree among the check-cases (the US 1976 value 28.9644 moves cases 1, 2, 6 and 7 inside but cases 4 and 5 outside), so no single constant is at fault (outside by up to 5.5e-07 at t=29.7 s)."

