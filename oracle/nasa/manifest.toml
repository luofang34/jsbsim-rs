# The F-16 cases, 11 to 16, fly oracle/nasa/aircraft/f16. The port matches
# C++ JSBSim on this hand-translated DAVE-ML F-16; the model lands near,
# but mostly outside, NASA's sims-4/5 envelope; causes are not isolated and
# translation error is not excluded.
#
# Every F-16 script runs Adams-Bashforth 4 on all four integrators at
# dt = 0.0025 s. It has converged where the F-16 moves fastest: check-case
# 13.3's roll rate at 15.3, 15.5 and 15.6 s lies within 2.63, 1.74 and
# 1.01 deg/s of a run at dt = 0.00125 s and within 1.53, 1.00 and
# 0.57 deg/s of one at dt = 0.0003125 s, with the same integrators. The
# TM's JSBSim setting (B.6.7), 120 Hz with Adams-Bashforth 4, is rejected:
# it sets check-case 13.2 into a roll limit cycle, |p| reaching 31 deg/s
# after t = 10 s, on which Rust and C++ diverge. JSBSim's default integrators at dt = 0.0025 s are
# 5.1 and 8.5 deg/s off the dt = 0.00125 s run at 15.3 and 15.5 s.
#
# Each case also runs as <case>_exact from the exact trim of
# aircraft/f16/reset_Atmos_*_exact.xml (body rates at the local transport
# rate, SIM 5's trim definition, without FGTrim); a primary case's miss is
# put down to FGTrim when its exact variant passes that variable.
#
# The strict rule cannot be met by an independent simulator: left out and
# compared with the envelope of SIM 4 and SIM 5, NASA's SIM 2 lies outside
# on 24 of its 24 variables in all eight cases (`oracle nasa compare` logs
# this leave-one-out per case). Each variable's report line therefore
# also gives R, C++ JSBSim's largest distance over time to its nearest
# simulator divided by the largest distance over time between the two
# closest simulators, as information, not a gate: R <= 1 means the miss
# lies within the simulators' own spread.
[[case]]
name = "Atmos_11"
archive = "Atmos_11_TrimCheckSubsonicF16"
root = "nasa"
script = "scripts/Atmos_11.xml"
aircraft_path = "aircraft"
section = "Appendix C.1.11, Table 35"

[case.parity]
rel = 1e-08
cause = "Bit-identical with C++ built to call sin and cos separately and the port on the platform maths library, checked on every oracle-ci run by the sincos gate (scripts/oracle-sincos.sh); the gate's builds differ in the last digit of sin and cos (Apple's fused __sincos_stret against the libm crate), which the trim and the F-16's dynamics carry to 4.7e-10 of a property's magnitude here."

