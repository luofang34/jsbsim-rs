# SPDX-License-Identifier: LGPL-2.1-or-later
# Atmospheric check-case data of NASA/TM-2015-218675 for the optional
# comparison run by scripts/oracle-nasa.sh. Only these pins are committed:
# `oracle nasa fetch` downloads each archive into target/oracle/nasa and
# fails unless its size and sha256 match.
#
# A case's script is found under `root`: "jsbsim" is the JSBSim checkout
# for C++ and oracle/inputs for Rust; "nasa" is oracle/nasa for both.
#
# A sample passes when it lies inside the simulators' [min, max] at that
# time, widened only by their ten-digit printed precision. Each
# expected_miss names a variable C++ JSBSim lies outside on and why; the
# comparison fails if it stops missing or is not compared in that case,
# and the Rust port must miss on exactly the same samples, except where
# C++ lies within the case's parity bound of the threshold and Rust within
# it of C++ (tools/oracle/src/nasa/flip.rs); a case allows at most its
# [case.parity] max_threshold_flips of those, each with its cause. Each
# case, and the run, ends with its count of every verdict.

