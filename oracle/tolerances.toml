[[tolerance]]
case = "atmosphere"
property = "*"
abs = 0.0
rel = 0.0
reason = "Temperatures, sound speeds, their ratios, biases, gradients, unit conversions and every value not listed below use only IEEE basic operations and sqrt in JSBSim's order, so they must be bit-identical."

[[tolerance]]
case = "atmosphere"
property = "*/atmosphere/P-psf"
abs = 0.0
rel = 1e-15
reason = "Pressure comes from pow/exp of the layer equations (libm last-ulp differences); observed max rel 4.4e-16."

[[tolerance]]
case = "atmosphere"
property = "*/atmosphere/delta"
abs = 0.0
rel = 1e-15
reason = "Pressure ratio inherits the pow/exp pressure; observed max rel 4.3e-16."

[[tolerance]]
case = "atmosphere"
property = "*/atmosphere/rho-slugs_ft3"
abs = 0.0
rel = 1e-15
reason = "Density divides the pow/exp pressure; observed max rel 4.2e-16."

[[tolerance]]
case = "atmosphere"
property = "*/atmosphere/sigma"
abs = 0.0
rel = 1e-15
reason = "Density ratio inherits the pow/exp pressure; observed max rel 5.0e-16."

[[tolerance]]
case = "atmosphere"
property = "*/atmosphere/pressure-altitude"
abs = 1e-10
rel = 1e-14
reason = "Inverts pressure with pow/log; Hb + (Tmb/Lmb)*(pow(x)-1) cancels near layer bases, so an absolute floor covers near-zero references; observed max |diff| 2.2e-11 ft, max rel 1.6e-15."

[[tolerance]]
case = "atmosphere"
property = "*/atmosphere/density-altitude"
abs = 1e-10
rel = 1e-14
reason = "Inverts density with pow/log; cancels near layer bases like the pressure altitude; observed max |diff| 2.9e-11 ft, max rel 5.8e-16."

[[tolerance]]
case = "atmosphere"
property = "*/atmosphere/saturated-vapor-pressure-psf"
