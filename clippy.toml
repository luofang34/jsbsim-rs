allow-dbg-in-tests = true
allow-expect-in-tests = true
allow-indexing-slicing-in-tests = true
allow-panic-in-tests = true
allow-print-in-tests = true
allow-unwrap-in-tests = true
disallowed-types = [
    { path = "anyhow::Error", reason = "libraries use typed thiserror enums" },
]
disallowed-methods = [
    { path = "libm::exp", reason = "use jsbsim::elementary::exp, which matches the platform libraries' speed" },
    { path = "libm::pow", reason = "use jsbsim::elementary::pow, which matches the platform libraries' speed" },
    # --- C++ mirroring: begin (see Cargo.toml) ---------------------------
    # Each rounds differently from the C++ expression it would replace.
    { path = "f64::mul_add", reason = "fuses a multiply-add C++ JSBSim rounds twice" },
    { path = "f64::hypot", reason = "C++ JSBSim computes sqrt(x*x + y*y); use libm::hypot only where it calls hypot" },
    { path = "f64::ln_1p", reason = "C++ JSBSim computes log(1 + x)" },
    { path = "f64::exp_m1", reason = "C++ JSBSim computes exp(x) - 1" },
    # --- C++ mirroring: end ----------------------------------------------
]
disallowed-macros = [
    { path = "std::println", reason = "use tracing" },
    { path = "std::eprintln", reason = "use tracing" },
    { path = "std::print", reason = "use tracing" },
    { path = "std::eprint", reason = "use tracing" },
    { path = "std::dbg", reason = "use tracing" },
]
